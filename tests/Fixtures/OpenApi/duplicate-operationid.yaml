openapi: "3.0.0"
info:
  title: Test API
  version: "1.0.0"
servers:
  - url: "http://localhost:8000"
paths:
  /api/health:
    get:
      operationId: getServiceHealth
      summary: All services health check
      security:
        - sanctum: []
      tags:
        - HealthCheck
      responses:
        "200":
          description: OK
        "401":
          description: Unauthenticated
        "503":
          description: Degraded
  /api/health/{service}:
    get:
      # operationId intentionally duplicates the one above — triggers duplicate operationId warning
      operationId: getServiceHealth
      summary: Single service health check
      security:
        - sanctum: []
      tags:
        - HealthCheck
      parameters:
        - name: service
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
        "401":
          description: Unauthenticated
        "404":
          description: Not found
        "503":
          description: Degraded
components:
  securitySchemes:
    sanctum:
      type: http
      scheme: bearer
