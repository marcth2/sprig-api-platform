openapi: "3.0.0"
info:
  title: Test API
  version: "1.0.0"
servers:
  - url: "http://localhost:8000"
paths:
  /api/health:
    get:
      operationId: getHealthAggregate
      summary: All services health check
      security:
        - sanctum: []
      tags:
        - HealthCheck
      responses:
        "200":
          description: OK
        "401":
          description: Unauthenticated
        "503":
          description: Degraded
# /api/health/{service} intentionally omitted — undocumented route test
components:
  securitySchemes:
    sanctum:
      type: http
      scheme: bearer
