services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
      args:
        UID: "${UID:-1000}"
        GID: "${GID:-1000}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - .:/var/www/html
    networks:
      - laravel
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    ports:
      - "8000:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - laravel
    depends_on:
      - app
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/up"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  mariadb:
    image: mariadb:11
    environment:
      MARIADB_ROOT_PASSWORD: "${DB_ROOT_PASSWORD:-root}"
      MARIADB_DATABASE: "${DB_DATABASE:-laravel}"
      MARIADB_USER: "${DB_USERNAME:-laravel}"
      MARIADB_PASSWORD: "${DB_PASSWORD:-password}"
    volumes:
      - mariadb_data:/var/lib/mysql
    ports:
      - "127.0.0.1:3307:3306"
    networks:
      - laravel
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis:
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD:-laravel-dev}
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:6380:6379"
    networks:
      - laravel
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD:-laravel-dev} --no-auth-warning ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  mailpit:
    image: axllent/mailpit
    ports:
      - "127.0.0.1:8026:8025"
      - "127.0.0.1:1026:1025"
    networks:
      - laravel

  swagger-ui:
    image: swaggerapi/swagger-ui
    ports:
      - "8081:8080"
    volumes:
      - ./storage/api-docs:/usr/share/nginx/html/api-docs
    environment:
      SWAGGER_JSON: /usr/share/nginx/html/api-docs/openapi.yaml
    networks:
      - laravel

networks:
  laravel:
    driver: bridge

volumes:
  mariadb_data:
  redis_data:
