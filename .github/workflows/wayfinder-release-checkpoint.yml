name: Wayfinder release checkpoint

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Flag any referenced wayfinder that's still open
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const tag = context.ref.replace('refs/tags/', '');
            const version = tag.replace(/^v/, '');

            const changelog = fs.readFileSync('CHANGELOG.md', 'utf8');
            const escaped = version.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
            const sectionMatch = changelog.match(new RegExp(`## \\[${escaped}\\][^\\n]*\\n([\\s\\S]*?)(?=\\n## \\[|$)`));

            if (!sectionMatch) {
              core.warning(`No CHANGELOG.md section found for ${version}; cannot check wayfinder sequencing for ${tag}.`);
              return;
            }

            const section = sectionMatch[1];
            const issueNumbers = [...new Set([...section.matchAll(/#(\d+)/g)].map(m => Number(m[1])))];

            const openWayfinders = [];
            for (const number of issueNumbers) {
              let issue;
              try {
                ({ data: issue } = await github.rest.issues.get({ owner, repo, issue_number: number }));
              } catch (e) {
                continue;
              }
              const labels = issue.labels.map(l => l.name);
              if (labels.includes('wayfinder:map') && issue.state === 'open') {
                openWayfinders.push(issue);
              }
            }

            if (openWayfinders.length === 0) {
              return;
            }

            for (const wf of openWayfinders) {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: wf.number,
                body: `Release [\`${tag}\`](https://github.com/${owner}/${repo}/releases/tag/${tag})'s CHANGELOG entry references this wayfinder, but it's still open. Per the wayfinder -> QA -> release sequencing rule (CLAUDE.md), a release should not be cut before its wayfinder closes. This is a detection-only flag: the tag/release is immutable and was not touched.`,
              });
            }

            core.setFailed(`Release ${tag} was cut while referencing ${openWayfinders.length} still-open wayfinder(s): ${openWayfinders.map(w => `#${w.number}`).join(', ')}`);
